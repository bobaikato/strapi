version: 1
metadata:
  ota:
    minimum_version: "1.6.21"
# Pressure-test note (local branch):
# - Remove `build` before an upstream PR unless the widened build lane is fully proven in matrix and
#   we want the PR to claim more than the lightweight baseline verify path.
project:
  name: strapi
  description: Strapi contributor readiness slice covering workspace hydration plus root lint, unit-test, and optional build proof
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: node:22-bookworm
        engines:
          - docker
          - podman
      attachments:
        isolated_paths:
          - node_modules
toolchains:
  node:
    version: '22'
    package_managers:
      yarn: '4'
    fulfillment:
      source: corepack
      mode: run
tasks:
  setup:
    context: host
    category: setup
    description: Install Strapi workspace dependencies through the declared Yarn hydration lane.
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: yarn
        mode: install
        frozen_lockfile: true
    execution:
      default_mode: native
      modes:
        container:
          context: app
    effects:
      writes:
        - node_modules
      network: true
      network_kind: dependency_hydration
    requirements:
      toolchains:
        - node
    notes: |
      The repo already declares `packageManager: yarn@4.12.0`, so Ota can own this as structured
      Yarn hydration instead of an opaque shell that manually resets the package-manager version.
    internal: true
  lint:
    context: host
    category: test
    description: Run Strapi workspace lint checks.
    command:
      exe: corepack
      args:
        - yarn
        - lint
    execution:
      default_mode: native
      modes:
        container:
          context: app
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Run the root lint surface declared by repository scripts.
      This is the truthful repo lint lane for the slice, and upstream warnings currently fail the
      task rather than behaving like a lightweight advisory pass.
  test:
    context: host
    category: test
    description: Run Strapi unit tests via Vitest.
    command:
      exe: corepack
      args:
        - yarn
        - test:unit:vitest
    execution:
      default_mode: native
      modes:
        container:
          context: app
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Run the unit-vitest path surfaced by the repository root scripts.
      This is a real supported test lane, but it currently reflects an upstream failing Vitest
      suite rather than a guaranteed quick local smoke pass.
  build:
    context: host
    category: build
    description: Build the Strapi workspace packages.
    command:
      exe: corepack
      args:
        - yarn
        - build
    execution:
      default_mode: native
      modes:
        container:
          context: app
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Run the root build surface declared by repository scripts.
      This is a widened pressure-test lane and should stay local-only unless matrix proof shows the
      repo wants this broader build claim in the upstream contract.
  verify:
    category: test
    description: Run the canonical Strapi contributor verification slice.
    aggregate:
      tasks:
        - lint
        - test
    safe_for_agent: true
    notes: |
      Contract-level verification path for contributor checks.
      This keeps the default proof on the real lint and unit-test surfaces instead of a synthetic
      package-manager smoke lane.
workflows:
  default: verify
  verify:
    description: Canonical Strapi verification path for this contract slice.
    setup:
      task: setup
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to run the declared setup plus verification sequence.
      This workflow is the truthful contributor baseline for the slice: workspace hydration plus
      the real root lint and unit-test lanes.
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks:
  - verify
  verify_after_changes:
  - verify
  writable_paths:
  - node_modules
  - docs
  - examples/complex
  - examples/empty
  - examples/experimental-dev
  - examples/getstarted
  - examples/kitchensink
  - examples/kitchensink-ts
  - examples/plugins
  - packages/admin-test-utils
  - packages/cli
  - packages/core
  - packages/generators
  - packages/plugins
  - packages/providers
  - packages/utils
  - public
  - scripts
  - templates
  - tests
  protected_paths:
  - .github/workflows
  - ota.yaml
  - yarn.lock
  inferred_boundary:
    reviewed: true
    provenance:
      writable_paths:
      - init:common_source_roots
      - init:nested_project_root
      - init:stack_source_scan
      protected_paths:
      - init:contract_file_default
      - init:stack_companion_control_files
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_BRANCH=1.6.22-implementation sh -s -- --from-git
      powershell: $env:OTA_GIT_BRANCH='1.6.22-implementation'; & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
  notes: |
    Use `ota workflows` to inspect declared workflow paths.
    Use `ota up --workflow verify` when you want setup and verification through one declared path.
    Use `ota tasks --safe --use` to inspect the approved agent task surface before execution.
    Use `ota validate` before changes and `ota doctor` after edits.
    Use `ota run verify` for the contract verification path.
    Treat `verify` as the real contributor baseline for this slice, and `build` as the widened
    pressure lane that remains outside the default claim until broader matrix proof says otherwise.
