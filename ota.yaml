version: 1
metadata:
  ota:
    minimum_version: "1.6.18"
# Pressure-test note (local branch):
# - Remove `build` before an upstream PR unless the widened build lane is fully proven in matrix and
#   we want the PR to claim more than the lightweight baseline verify path.
project:
  name: strapi
  description: Strapi contributor readiness slice covering root workspace install and baseline verification
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: node:22-bookworm
        engines:
          - docker
          - podman
      attachments:
        isolated_paths:
          - node_modules
toolchains:
  node:
    provider: corepack
    version: '22'
    package_managers:
      yarn: '4'
tasks:
  setup:
    context: host
    category: setup
    description: Install repo dependencies.
    run: corepack yarn set version 4.12.0 && corepack yarn install
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: corepack yarn set version 4.12.0 && corepack yarn install
        container:
          context: app
          run: corepack yarn set version 4.12.0 && corepack yarn install
    effects:
      network: true
      network_kind: dependency_hydration
    notes: Materialize the repo-pinned Yarn release, then install workspace dependencies.
    internal: true
  lint:
    context: host
    category: dev
    description: Run Strapi workspace lint checks.
    run: corepack yarn lint
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: corepack yarn lint
        container:
          context: app
          run: corepack yarn lint
    depends_on:
      - setup
    notes: |
      Run the root lint surface declared by repository scripts.
      This is the truthful repo lint lane for the slice, and upstream warnings currently fail the
      task rather than behaving like a lightweight advisory pass.
  test:
    context: host
    category: dev
    description: Run Strapi unit tests via Vitest.
    run: corepack yarn test:unit:vitest
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: corepack yarn test:unit:vitest
        container:
          context: app
          run: corepack yarn test:unit:vitest
    depends_on:
      - setup
    notes: |
      Run the unit-vitest path surfaced by the repository root scripts.
      This is a real supported test lane, but it currently reflects an upstream failing Vitest
      suite rather than a guaranteed quick local smoke pass.
  build:
    context: host
    category: build
    description: Build the Strapi workspace packages.
    run: corepack yarn build
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: corepack yarn build
        container:
          context: app
          run: corepack yarn build
    depends_on:
      - setup
    notes: |
      Run the root build surface declared by repository scripts.
      This is a widened pressure-test lane and should stay local-only unless matrix proof shows the
      repo wants this broader build claim in the upstream contract.
  verify:
    context: host
    category: test
    description: Verify package-manager runtime after dependency hydration.
    run: corepack yarn --version
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: corepack yarn --version
        container:
          context: app
          run: corepack yarn --version
    depends_on:
      - setup
    safe_for_agent: true
    notes: |
      Contract-level baseline verification path for contributor checks.
      This path is intentionally lightweight compared with `lint` and `test`, and is the safer
      local-fast baseline when you only need setup plus package-manager/runtime proof.
workflows:
  default: verify
  verify:
    description: Canonical Strapi verification path for this contract slice.
    setup:
      task: setup
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to run the declared setup plus verification sequence.
      This workflow is the local-fast baseline for the slice; use `ota run lint` or `ota run test`
      when you want the heavier real repo lanes that currently surface upstream failures.
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks:
  - verify
  verify_after_changes:
  - verify
  writable_paths:
  - docs
  - examples/complex
  - examples/empty
  - examples/experimental-dev
  - examples/getstarted
  - examples/kitchensink
  - examples/kitchensink-ts
  - examples/plugins
  - packages/admin-test-utils
  - packages/cli
  - packages/core
  - packages/generators
  - packages/plugins
  - packages/providers
  - packages/utils
  - public
  - scripts
  - templates
  - tests
  protected_paths:
  - .github/workflows
  - ota.yaml
  - yarn.lock
  inferred_boundary:
    reviewed: true
    provenance:
      writable_paths:
      - init:common_source_roots
      - init:nested_project_root
      - init:stack_source_scan
      protected_paths:
      - init:contract_file_default
      - init:stack_companion_control_files
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV=08c270351c9870c82a39899161388bb250ad23c4 sh -s -- --from-git
      powershell: $env:OTA_GIT_REV='08c270351c9870c82a39899161388bb250ad23c4'; & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
  notes: |
    Use `ota workflows` to inspect declared workflow paths.
    Use `ota up --workflow verify` when you want setup and verification through one declared path.
    Use `ota tasks --safe --use` to inspect the approved agent task surface before execution.
    Use `ota validate` before changes and `ota doctor` after edits.
    Use `ota run verify` for the contract verification path.
    Treat `verify` as the light baseline and `lint` / `test` as the real repo lanes, which
    currently expose upstream failures rather than clean local-smoke paths.
